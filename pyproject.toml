[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acad-portable"
version = "0.1.0"
description = "AutoCAD 2024 portable environment reimplementation"
requires-python = ">=3.11"

[project.scripts]
acad-portable = "acad_portable.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]


